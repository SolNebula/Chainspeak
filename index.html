<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conversation Drill — Korean & Chinese</title>

<!--
  ╔═══════════════════════════════════════════════════════════════╗
  ║  CONVERSATION DRILL — Korean & Chinese                       ║
  ║                                                               ║
  ║  A conversation-first language learning app built around a    ║
  ║  4-beat conversational cycle:                                 ║
  ║                                                               ║
  ║    Beat 1: STATEMENT   — self-disclosure / answer bridge Q    ║
  ║    Beat 2: ASK         — open-ended question about the topic  ║
  ║    Beat 3: ECHO        — confirm/verify what you heard        ║
  ║    Beat 4: BRIDGE      — react + ask question → next rep      ║
  ║                                                               ║
  ║  Adapted from Tony Marsh's 1·2·3 Cups method, restructured   ║
  ║  to match how Korean and Chinese conversations naturally      ║
  ║  flow: Statement → Open Q → Confirmation → Elaboration.      ║
  ║                                                               ║
  ║  7 weeks. 18 reps (+ review). One continuous conversation     ║
  ║  arc from strangers → friends.                                ║
  ║                                                               ║
  ║  TABS:                                                        ║
  ║    1. Weekly Drills — the 4-beat conversation exercises        ║
  ║    2. Verb Seeds   — conjugation reference for 12 core verbs  ║
  ╚═══════════════════════════════════════════════════════════════╝

  FONTS:
    - Noto Serif KR: Korean characters
    - Noto Serif SC: Simplified Chinese characters
    - Playfair Display: English UI text (headings, buttons, labels)
-->
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&family=Noto+Serif+SC:wght@300;400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>
  /* ─────────────────────────────────────────────
     COLOR PALETTE
     All colors defined as CSS variables for
     consistent reuse throughout the app.

     Base palette (editorial/refined aesthetic):
       navy  → primary text, active states, headings
       teal  → secondary text, labels, muted accents
       sky   → card headers, vocab boxes, light bgs
       beige → page background
       white → card surfaces, nav bar

     Beat tag colors (one per beat type):
       b1 (Statement) → green
       b2 (Ask)       → blue
       b3 (Echo)      → amber/orange
       b4 (Bridge)    → purple

     Review week uses the drill-* palette (amber)
     to visually distinguish it from content weeks.
  ───────────────────────────────────────────── */
  :root {
    --navy:   #2F4156;
    --teal:   #567C8D;
    --sky:    #C8D9E6;
    --beige:  #F5EFEB;
    --white:  #FFFFFF;
    --bg:     var(--beige);
    --surface: var(--white);
    --border:  #d4ccc6;
    --border2: #b8cdd9;
    --faint:   #e4ddd8;

    /* Review week (amber) */
    --drill-bg:     #fff7ed;
    --drill-border: #e8a04a;
    --drill-text:   #8a4a10;
    --drill-badge:  #c45e00;

    /* Beat 1: Statement — green */
    --b1-bg: #e8f6ee;  --b1-border: #a8dbbe; --b1-text: #2a7a4a;
    /* Beat 2: Ask — blue */
    --b2-bg: #e8eeff;  --b2-border: #a0b0f0; --b2-text: #3040b0;
    /* Beat 3: Echo — amber */
    --b3-bg: #fef3e2;  --b3-border: #f0c88a; --b3-text: #b06010;
    /* Beat 4: Bridge — purple */
    --b4-bg: #f3e8f6;  --b4-border: #c4a0d8; --b4-text: #6a2a8a;
  }

  /* ─── RESET ─── */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--navy);
    font-family: 'Playfair Display', Georgia, serif;
    min-height: 100vh;
  }


  /* ─────────────────────────────────────────────
     TOP NAVIGATION BAR
     Left: app title + subtitle
     Right: language toggle (한국어 / Both / 中文)
  ───────────────────────────────────────────── */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    background: var(--white); flex-wrap: wrap; gap: 12px;
  }
  .nav-title {
    font-size: 11px; letter-spacing: 3px;
    color: var(--teal); text-transform: uppercase;
  }
  .nav-h { font-size: 18px; font-weight: 400; margin-top: 3px; color: var(--navy); }

  /* Language toggle: pill container with 3 buttons */
  .lang-toggle { display: flex; background: var(--sky); border-radius: 8px; padding: 3px; gap: 3px; }
  .lang-btn {
    padding: 5px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-family: 'Noto Serif KR', serif; font-size: 12px;
    background: transparent; color: var(--teal); transition: all .15s;
  }
  .lang-btn.active { background: var(--navy); color: var(--white); }


  /* ─────────────────────────────────────────────
     MAIN TAB BAR
     Switches between "Weekly Drills" and "Verb Seeds".
     Active tab has navy underline.
  ───────────────────────────────────────────── */
  .tabs {
    display: flex; border-bottom: 1px solid var(--border);
    background: var(--white);
  }
  .tab-btn {
    padding: 13px 22px; border: none;
    border-bottom: 2px solid transparent; cursor: pointer;
    background: transparent; font-family: 'Playfair Display', serif;
    font-size: 13px; color: var(--teal); transition: all .15s;
    margin-bottom: -1px;
  }
  .tab-btn.active { color: var(--navy); border-bottom-color: var(--navy); }

  /* Content wrapper: padding + max-width cap */
  .content { padding: 24px 28px; max-width: 960px; }


  /* ─────────────────────────────────────────────
     WEEK SELECTOR STRIP
     Horizontal scrollable row of week buttons.
     Week 7 (Review) gets amber styling.
  ───────────────────────────────────────────── */
  .week-strip {
    display: flex; gap: 6px; overflow-x: auto;
    padding-bottom: 16px; scrollbar-width: none;
  }
  .week-strip::-webkit-scrollbar { display: none; }

  .week-btn {
    flex-shrink: 0; padding: 8px 14px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer;
    background: var(--white); color: var(--teal);
    font-family: 'Playfair Display', serif; font-size: 11px;
    text-align: center; transition: all .15s; position: relative;
  }
  .week-btn:hover { border-color: var(--teal); }
  .week-btn.active {
    background: var(--navy); color: var(--white);
    border-color: var(--navy);
  }
  .week-btn .wk-num { font-weight: 700; font-size: 14px; display: block; }
  .week-btn .wk-focus { margin-top: 2px; display: block; font-size: 10px; }

  /* Week 7 review styling */
  .week-btn.review-week {
    border-color: var(--drill-border);
    background: var(--drill-bg); color: var(--drill-text);
  }
  .week-btn.review-week.active {
    background: var(--drill-badge); color: var(--white);
    border-color: var(--drill-badge);
  }
  .review-badge {
    display: inline-block; font-size: 8px; font-family: monospace;
    font-weight: 700; letter-spacing: 1px; background: var(--drill-badge);
    color: white; padding: 1px 5px; border-radius: 3px; margin-top: 3px;
  }
  .week-btn.active .review-badge { background: rgba(255,255,255,0.3); }


  /* ─────────────────────────────────────────────
     TASK BAR
     Shows the goal/instruction for the selected week.
     Normal weeks: navy left border.
     Review week: amber left border + amber bg.
  ───────────────────────────────────────────── */
  .task-bar {
    border-radius: 8px; padding: 12px 16px; margin-bottom: 18px;
    border: 1px solid var(--border); border-left-width: 3px;
    background: var(--white);
  }
  .task-bar.normal { border-left-color: var(--navy); }
  .task-bar.review { border-left-color: var(--drill-badge); background: var(--drill-bg); }

  .task-label {
    font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
    margin-bottom: 4px; font-family: monospace;
  }
  .task-label.normal { color: var(--teal); }
  .task-label.review { color: var(--drill-badge); }
  .task-text { font-size: 14px; color: var(--navy); line-height: 1.5; }


  /* ─────────────────────────────────────────────
     REP CARD
     Each card = one conversational rep.
     Structure:
       rep-header   ← sky bg, rep number + title + verb seed badge
       scenario     ← italic context-setting text
       rep-body     ← flexbox: Korean beats | Chinese beats
       ref-toggle   ← collapsible reference conversation
  ───────────────────────────────────────────── */
  .rep-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 0;
  }
  .rep-header {
    padding: 10px 16px; border-bottom: 1px solid var(--faint);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--sky);
  }
  .rep-header-left { display: flex; align-items: center; gap: 10px; }

  /* Circular number badge */
  .rep-num {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--navy); display: flex; align-items: center;
    justify-content: center; font-size: 11px; color: var(--white);
    font-weight: 700; flex-shrink: 0;
  }
  .rep-title { font-size: 13px; color: var(--navy); font-style: italic; }

  /* Verb seed pill badge in header */
  .rep-verb {
    font-size: 10px; font-family: 'Noto Serif KR', 'Noto Serif SC', serif;
    color: var(--teal); background: var(--white); padding: 2px 8px;
    border-radius: 4px; border: 1px solid var(--border2);
  }


  /* ─────────────────────────────────────────────
     SCENARIO BAR
     Italic context text below the rep header.
     Sets the scene for the active recall exercise.
  ───────────────────────────────────────────── */
  .scenario {
    padding: 12px 16px; font-size: 12px; color: var(--teal);
    line-height: 1.5; border-bottom: 1px solid var(--faint);
    font-style: italic;
  }


  /* ─────────────────────────────────────────────
     BEAT ROWS
     Each beat = one line of the 4-beat cycle.
     Contains: colored tag + prompt + hint + structure + production line
  ───────────────────────────────────────────── */
  .rep-body { display: flex; }
  .lang-block { flex: 1; padding: 14px 16px; }
  .lang-block.border-right { border-right: 1px solid var(--faint); }
  .lang-label {
    font-size: 10px; letter-spacing: 2px; color: var(--teal);
    text-transform: uppercase; margin-bottom: 10px;
    font-family: monospace; opacity: .6;
  }

  .beat-row {
    display: flex; gap: 10px; align-items: flex-start;
    margin-bottom: 12px;
  }
  .beat-row:last-child { margin-bottom: 0; }

  /* Beat type tag (STMT / ASK / ECHO / BRIDGE) */
  .beat-tag {
    flex-shrink: 0; width: 50px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 700; font-family: monospace;
    margin-top: 3px; letter-spacing: .5px;
  }
  .beat-tag.b1 { background: var(--b1-bg); border: 1px solid var(--b1-border); color: var(--b1-text); }
  .beat-tag.b2 { background: var(--b2-bg); border: 1px solid var(--b2-border); color: var(--b2-text); }
  .beat-tag.b3 { background: var(--b3-bg); border: 1px solid var(--b3-border); color: var(--b3-text); }
  .beat-tag.b4 { background: var(--b4-bg); border: 1px solid var(--b4-border); color: var(--b4-text); }

  /* Beat content elements */
  .beat-prompt { font-size: 13px; color: var(--navy); line-height: 1.4; }
  .beat-hint {
    font-size: 11px; color: var(--teal); margin-top: 3px;
    font-family: monospace; opacity: .65;
  }
  .beat-structure {
    font-size: 11px; color: var(--navy); margin-top: 2px;
    font-family: 'Noto Serif KR', 'Noto Serif SC', monospace;
    opacity: .5; font-style: italic;
  }
  /* Partner response bubble (shown at Beat 3 for echo context) */
  .beat-partner {
    font-size: 11px; color: var(--b3-text); margin-top: 4px;
    font-style: italic; padding: 4px 8px; background: var(--b3-bg);
    border-radius: 4px; border: 1px solid var(--b3-border);
    display: inline-block;
  }
  .beat-partner .pinyin {
    font-family: monospace; font-size: 10px;
    color: var(--teal); display: block; margin-top: 1px;
  }
  /* Dashed line where the learner writes/speaks their production */
  .production-line {
    margin-top: 6px; border-bottom: 1px dashed var(--border);
    padding-bottom: 2px; font-size: 12px; color: var(--border);
    font-style: italic; min-width: 180px;
  }


  /* ─────────────────────────────────────────────
     CHAIN ARROW
     Visual connector between reps (↓ symbol).
     Shows the chaining relationship.
  ───────────────────────────────────────────── */
  .chain-arrow {
    text-align: center; padding: 8px 0;
    color: var(--teal); font-size: 18px; opacity: .4;
  }


  /* ─────────────────────────────────────────────
     REFERENCE CONVERSATION TOGGLE
     Collapsible <details> element at the bottom
     of each rep card. Hidden by default.
     Contains: full scripted conversation + key vocab.
  ───────────────────────────────────────────── */
  .ref-toggle { border-top: 1px solid var(--faint); }
  .ref-toggle summary {
    padding: 10px 16px; font-size: 11px; color: var(--teal);
    cursor: pointer; font-family: monospace; letter-spacing: .5px;
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  .ref-toggle summary::-webkit-details-marker { display: none; }
  .ref-toggle summary::before { content: '▶'; font-size: 8px; transition: transform .2s; }
  .ref-toggle[open] summary::before { transform: rotate(90deg); }

  .ref-content { padding: 0 16px 14px; display: flex; gap: 0; }
  .ref-lang { flex: 1; padding: 0; }
  .ref-lang.border-right {
    border-right: 1px solid var(--faint);
    padding-right: 12px; margin-right: 12px;
  }
  .ref-line {
    font-size: 12px; line-height: 1.6; color: var(--navy);
    font-family: 'Noto Serif KR', 'Noto Serif SC', serif;
    margin-bottom: 4px;
  }
  .ref-line.partner { color: var(--teal); font-style: italic; }
  .ref-line .pinyin { font-family: monospace; font-size: 10px; color: var(--teal); opacity: .7; }

  /* Key vocab section inside reference toggle */
  .ref-vocab {
    margin-top: 8px; padding-top: 8px;
    border-top: 1px solid var(--faint);
  }
  .ref-vocab-title {
    font-size: 9px; font-family: monospace; letter-spacing: 1.5px;
    color: var(--teal); text-transform: uppercase; margin-bottom: 4px;
  }
  .ref-vocab-item { font-size: 11px; color: var(--navy); line-height: 1.6; }
  .ref-vocab-item .word {
    font-family: 'Noto Serif KR', 'Noto Serif SC', serif;
    font-weight: 700;
  }
  .ref-vocab-item .meaning { color: var(--teal); margin-left: 4px; }


  /* ─────────────────────────────────────────────
     BRIDGE PATTERNS CARD
     Shown at the bottom of each week's drill.
     Lists the key conversational connectors
     introduced that week.
  ───────────────────────────────────────────── */
  .bridge-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-top: 18px;
  }
  .bridge-header {
    padding: 10px 16px; background: var(--b4-bg);
    border-bottom: 1px solid var(--b4-border); font-size: 11px;
    font-family: monospace; color: var(--b4-text);
    letter-spacing: 1px; font-weight: 700;
  }
  .bridge-body { padding: 14px 16px; display: flex; gap: 0; }
  .bridge-col { flex: 1; }
  .bridge-col.border-right {
    border-right: 1px solid var(--faint);
    padding-right: 14px; margin-right: 14px;
  }
  .bridge-col-title {
    font-size: 9px; font-family: monospace; letter-spacing: 1.5px;
    color: var(--teal); text-transform: uppercase; margin-bottom: 6px;
  }
  .bridge-item { font-size: 12px; line-height: 1.8; color: var(--navy); }
  .bridge-item .pattern {
    font-family: 'Noto Serif KR', 'Noto Serif SC', serif;
    font-weight: 700;
  }
  .bridge-item .meaning { color: var(--teal); font-size: 11px; }


  /* ─────────────────────────────────────────────
     REVIEW WEEK BANNER
     Amber-styled info box shown only during Week 7.
  ───────────────────────────────────────────── */
  .review-banner {
    background: var(--drill-bg); border: 1px solid var(--drill-border);
    border-radius: 10px; padding: 14px 18px; margin-bottom: 18px;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .review-icon { font-size: 22px; line-height: 1; flex-shrink: 0; }
  .review-banner-title {
    font-size: 13px; font-weight: 700; color: var(--drill-badge);
    margin-bottom: 3px; letter-spacing: 0.5px;
  }
  .review-banner-text {
    font-size: 13px; color: var(--drill-text); line-height: 1.5;
  }


  /* ─────────────────────────────────────────────
     PROGRESS BAR
     Thin horizontal track at the bottom of the
     drill tab. Fills left-to-right as weeks advance.
  ───────────────────────────────────────────── */
  .progress-bar {
    margin-top: 18px; display: flex; align-items: center; gap: 10px;
  }
  .progress-label {
    font-size: 10px; color: var(--teal);
    font-family: monospace; letter-spacing: 1px;
  }
  .progress-track {
    flex: 1; height: 3px; background: var(--sky); border-radius: 2px;
  }
  .progress-fill {
    height: 100%; background: var(--navy); border-radius: 2px;
    transition: width 0.35s ease;
  }


  /* ─────────────────────────────────────────────
     REVIEW CHAIN CARD (Week 7)
     Shows the full 18-rep chain visualization
     so the learner can see the complete arc.
  ───────────────────────────────────────────── */
  .chain-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-top: 12px;
  }
  .chain-card-header {
    padding: 10px 16px; background: var(--sky);
    border-bottom: 1px solid var(--faint);
    font-size: 11px; font-family: monospace; letter-spacing: 1px;
    color: var(--navy); font-weight: 700;
  }
  .chain-card-body {
    padding: 14px 16px; font-size: 11px;
    font-family: 'Noto Serif KR', 'Noto Serif SC', monospace;
    color: var(--navy); line-height: 2; white-space: pre-wrap;
  }
  .chain-card-body .wk-label {
    font-weight: 700; color: var(--teal);
    font-family: monospace; font-size: 10px;
    letter-spacing: 1px;
  }


  /* ─────────────────────────────────────────────
     VERB SEEDS TAB STYLES
     (Preserved from original — reference tool
     for verb conjugation patterns)
  ───────────────────────────────────────────── */
  .verb-buttons {
    display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .verb-btn {
    padding: 9px 18px; border-radius: 8px;
    border: 1px solid var(--border); cursor: pointer;
    background: var(--white); color: var(--teal);
    font-family: 'Playfair Display', serif; font-size: 12px;
    transition: all .15s;
  }
  .verb-btn:hover { border-color: var(--teal); }
  .verb-btn.active {
    background: var(--navy); color: var(--white);
    border-color: var(--navy);
  }
  .verb-btn .vb-chars {
    font-weight: 700;
    font-family: 'Noto Serif KR', 'Noto Serif SC', serif;
  }
  .verb-btn .vb-eng { font-size: 10px; opacity: .5; margin-left: 6px; }

  /* Vocab strip */
  .vocab-header {
    display: flex; align-items: baseline;
    justify-content: space-between; margin-bottom: 8px;
  }
  .vocab-label {
    font-size: 10px; letter-spacing: 2px; color: var(--navy);
    text-transform: uppercase; font-family: monospace;
    font-weight: 700; opacity: .6;
  }
  .vocab-hint { font-size: 11px; color: var(--teal); font-style: italic; opacity: .7; }
  .vocab-strip {
    background: var(--sky); border: 1px solid var(--border2);
    border-radius: 10px; padding: 16px 20px; margin-bottom: 14px;
    display: flex; flex-wrap: wrap; justify-content: space-evenly;
    align-items: center; row-gap: 14px; column-gap: 8px;
  }
  .vocab-word {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; min-width: 64px; text-align: center;
  }
  .vocab-kr { font-size: 14px; color: var(--navy); font-family: 'Noto Serif KR', serif; font-weight: 700; }
  .vocab-zh { font-size: 14px; color: var(--teal); font-family: 'Noto Serif SC', serif; }

  /* Tense tabs */
  .tense-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tense-btn {
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-family: 'Playfair Display', serif;
    background: var(--white); color: var(--teal);
    border: 1px solid var(--border); transition: all .15s;
  }
  .tense-btn.active { background: var(--teal); color: var(--white); border-color: var(--teal); }

  /* Seed card (reuses set-card pattern) */
  .set-card {
    background: var(--white); border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden; margin-bottom: 14px;
  }
  .set-header {
    padding: 10px 16px; border-bottom: 1px solid var(--faint);
    display: flex; align-items: center; gap: 10px; background: var(--sky);
  }
  .set-body { display: flex; }
  .cup-row { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 10px; }
  .cup-row:last-child { margin-bottom: 0; }
  .cup-tag {
    flex-shrink: 0; width: 36px; height: 20px; border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; font-family: monospace; margin-top: 3px;
  }
  .cup-tag.s  { background: var(--b1-bg); border: 1px solid var(--b1-border); color: var(--b1-text); }
  .cup-tag.yn { background: var(--b3-bg); border: 1px solid var(--b3-border); color: var(--b3-text); }
  .cup-tag.q  { background: var(--b2-bg); border: 1px solid var(--b2-border); color: var(--b2-text); }
  .cup-main {
    font-size: 14px; color: var(--navy); line-height: 1.4;
    font-family: 'Noto Serif KR', 'Noto Serif SC', serif;
  }
  .cup-note { font-size: 11px; color: var(--teal); margin-top: 2px; font-family: monospace; opacity: .6; }

  /* Structure notes */
  .struct-note {
    margin-top: 12px; padding: 12px 16px; background: var(--sky);
    border-radius: 8px; border: 1px solid var(--border2);
  }
  .struct-note-row { display: flex; gap: 10px; align-items: flex-start; padding: 5px 0; }

   HELPER: makeRep()
   Shorthand factory for building a rep object.

     title    — display title ("Origin", "Residence", etc.)

     kr       — { beats:[], ref:[], vocab:[] } for Korean
     zh       — { beats:[], ref:[], vocab:[] } for Mandarin

function makeRep(num, title, verb, scenario, kr, zh) {
  return { num, title, verb, scenario, kr, zh };
}

   HELPER: B(type, label, prompt, hint, structure, partner, partnerPy)

     structure — optional target sentence pattern
     partner   — optional partner response (shown at echo beats)

function B(type, label, prompt, hint, structure, partner, partnerPy) {
  return { type, label, prompt, hint, structure: structure||null, partner: partner||null, partnerPy: partnerPy||null };

/**
 * renderBeats(beats, langKey)
 * Builds the HTML for one language column of a rep's beats.
 * Returns empty string if this language isn't currently selected.
 */
function renderBeats(beats, langKey) {
  if (currentLang !== 'both' && currentLang !== langKey) return '';
  const label = langKey === 'korean' ? '한국어 · Korean' : '中文 · Chinese';
  const br = langKey === 'korean' && currentLang === 'both' ? ' border-right' : '';

  return `<div class="lang-block${br}">
    <div class="lang-label">${label}</div>
    ${beats.map(b => {
      let html = `<div class="beat-row">
        <div class="beat-tag ${b.type}">${b.label}</div>
        <div>
          <div class="beat-prompt">${b.prompt}</div>`;

      /* Show partner response if present (usually at STMT or ECHO beats) */
      if (b.partner) {
        html += `<div class="beat-partner">${b.partner}${
          b.partnerPy ? `<span class="pinyin">${b.partnerPy}</span>` : ''
        }</div>`;
      }

      html += `<div class="beat-hint">hint: ${b.hint}</div>`;
      if (b.structure) html += `<div class="beat-structure">${b.structure}</div>`;
      html += `<div class="production-line">your production ...</div>`;
      html += `</div></div>`;
      return html;
    }).join('')}
  </div>`;
}

/**
 * renderRef(rep)
 * Builds the collapsible reference conversation + key vocab
 * for one rep. Respects currentLang to show KR, ZH, or both.
 */
function renderRef(rep) {
  const showKr = currentLang === 'both' || currentLang === 'korean';
  const showZh = currentLang === 'both' || currentLang === 'chinese';
  const brClass = showKr && showZh ? ' border-right' : '';

  let html = `<details class="ref-toggle"><summary>Show Reference Conversation</summary><div class="ref-content">`;

  if (showKr) {
    html += `<div class="ref-lang${brClass}">`;
    rep.kr.ref.forEach(r => {
      html += `<div class="ref-line${r.who === 'partner' ? ' partner' : ''}">${r.who === 'partner' ? '↳ ' : ''} ${r.text}</div>`;
    });
    html += `<div class="ref-vocab"><div class="ref-vocab-title">Key Vocab</div>`;
    rep.kr.vocab.forEach(v => {
      html += `<div class="ref-vocab-item"><span class="word">${v.w}</span> <span class="meaning">— ${v.m}</span></div>`;
    });
    html += `</div></div>`;
  }

  if (showZh) {
    html += `<div class="ref-lang">`;
    rep.zh.ref.forEach(r => {
      html += `<div class="ref-line${r.who === 'partner' ? ' partner' : ''}">${r.who === 'partner' ? '↳ ' : ''} ${r.text}${r.py ? ` <span class="pinyin">${r.py}</span>` : ''}</div>`;
    });
    html += `<div class="ref-vocab"><div class="ref-vocab-title">Key Vocab</div>`;
    rep.zh.vocab.forEach(v => {
      html += `<div class="ref-vocab-item"><span class="word">${v.w}</span> <span class="meaning">— ${v.m}</span></div>`;
    });
    html += `</div></div>`;
  }

  html += `</div></details>`;
  return html;
}

/**
 * renderBridges(week)
 * Builds the bridge patterns card at the bottom of a week.
 */
function renderBridges(week) {
  if (!week.bridges.kr.length && !week.bridges.zh.length) return '';
  const showKr = currentLang === 'both' || currentLang === 'korean';
  const showZh = currentLang === 'both' || currentLang === 'chinese';
  const brClass = showKr && showZh ? ' border-right' : '';

  let html = `<div class="bridge-card"><div class="bridge-header">BRIDGE PATTERNS</div><div class="bridge-body">`;
  if (showKr) {
    html += `<div class="bridge-col${brClass}"><div class="bridge-col-title">Korean</div>`;
    week.bridges.kr.forEach(b => html += `<div class="bridge-item"><span class="pattern">${b.p}</span> <span class="meaning">— ${b.m}</span></div>`);
    html += `</div>`;
  }
  if (showZh) {
    html += `<div class="bridge-col"><div class="bridge-col-title">Mandarin</div>`;
    week.bridges.zh.forEach(b => html += `<div class="bridge-item"><span class="pattern">${b.p}</span> <span class="meaning">— ${b.m}</span></div>`);
    html += `</div>`;
  }
  html += `</div></div>`;
  return html;
}

/**
 * renderWeek(weekData)
 * Builds the full HTML for a content week (reps + bridges).
 */
function renderWeek(weekData) {
  let html = '';
  weekData.reps.forEach((rep, i) => {
    html += `<div class="rep-card">
      <div class="rep-header">
        <div class="rep-header-left">
          <div class="rep-num">${rep.num}</div>
          <div class="rep-title">${rep.title}</div>
        </div>
        <div class="rep-verb">${rep.verb}</div>
      </div>
      <div class="scenario">${rep.scenario}</div>
      <div class="rep-body">
        ${renderBeats(rep.kr.beats, 'korean')}
        ${renderBeats(rep.zh.beats, 'chinese')}
      </div>
      ${renderRef(rep)}
    </div>`;
    /* Chain arrow between reps (not after last) */
    if (i < weekData.reps.length - 1) {
      html += `<div class="chain-arrow">↓</div>`;
    }
  });
  html += renderBridges(weekData);
  return html;
}

/**
 * renderReviewWeek()
 * Builds the Week 7 review view with banner + chain visualization.
 */
function renderReviewWeek() {
  /* Build the full chain text from all weeks */
  const chainLines = [];
  weeks.forEach((wk, wi) => {
    if (wk.isReview || !wk.reps.length) return;
    wk.reps.forEach(rep => {
      const lastKrRef = rep.kr.ref[rep.kr.ref.length - 1];
      const lastZhRef = rep.zh.ref[rep.zh.ref.length - 1];
      const krLine = lastKrRef.who === 'you' ? lastKrRef.text : '';
      const zhLine = lastZhRef.who === 'you' ? lastZhRef.text : '';
      const pyLine = lastZhRef.py || '';

      let display = '';
      if (currentLang !== 'chinese' && krLine) display += krLine;
      if (currentLang === 'both' && krLine && zhLine) display += '\n';
      if (currentLang !== 'korean' && zhLine) display += zhLine + (pyLine ? ` [${pyLine}]` : '');

      chainLines.push({
        label: `W${wi + 1} R${rep.num}`,
        title: rep.title,
        text: display
      });
    });
  });

  let html = `<div class="review-banner">
    <div class="review-icon">🔁</div>
    <div>
      <div class="review-banner-title">FULL REVIEW — No peeking</div>
      <div class="review-banner-text">Chain all 6 weeks as one continuous conversation. Work through each rep in order — produce all 4 beats aloud before moving on. Goal: the complete arc from strangers → friends without hesitation.</div>
    </div>
  </div>`;

  html += `<div class="chain-card">
    <div class="chain-card-header">FULL CHAIN — 18 REPS</div>
    <div class="chain-card-body">`;

  chainLines.forEach((line, i) => {
    html += `<span class="wk-label">${line.label}</span> ${line.title}\n${line.text}\n`;
    if (i < chainLines.length - 1) html += `  ↓\n`;
  });

  html += `</div></div>`;
  return html;
}


/* ═══════════════════════════════════════════════════════════════
   EVENT HANDLERS — DRILL TAB
═══════════════════════════════════════════════════════════════ */

/**
 * setWeek(w)
 * Called when a week button is clicked.
 * Updates state, re-styles task bar, renders content.
 */
function setWeek(w) {
  currentWeek = w;
  const week = weeks[w - 1];

  /* Update active state on week buttons */
  document.querySelectorAll('.week-btn').forEach((b, i) => {
    b.classList.toggle('active', i + 1 === w);
  });

  /* Update task bar */
  const tb = document.getElementById('task-bar-el');
  const tl = document.getElementById('task-label');
  if (week.isReview) {
    tb.className = 'task-bar review';
    tl.className = 'task-label review';
    tl.textContent = `Week ${w} · REVIEW`;
  } else {
    tb.className = 'task-bar normal';
    tl.className = 'task-label normal';
    tl.textContent = `Week ${w} · ${week.title}`;
  }
  document.getElementById('task-text').textContent = week.task;

  /* Render content */
  const container = document.getElementById('drill-container');
  if (week.isReview) {
    container.innerHTML = renderReviewWeek();
  } else {
    container.innerHTML = renderWeek(week);
  }

  /* Update progress bar */
  document.getElementById('progress-fill').style.width = `${(w / 7) * 100}%`;
  document.getElementById('progress-pct').textContent = `${w}/7`;
}

/**
 * setLang(l)
 * Called when a language toggle button is clicked.
 */
function setLang(l) {
  currentLang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    const map = { '한국어': 'korean', 'Both': 'both', '中文': 'chinese' };
    b.classList.toggle('active', map[b.textContent] === l);
  });
  /* Re-render whichever tab is visible */
  if (!document.getElementById('tab-drill').classList.contains('hidden')) {
    setWeek(currentWeek);
  } else {
    renderSeedCard();
    renderVocabStrip();
  }
}

/**
 * setTab(t)
 * Switches between drill and seeds tabs.
 */
function setTab(t) {
  document.getElementById('tab-drill').classList.toggle('hidden', t !== 'drill');
  document.getElementById('tab-seeds').classList.toggle('hidden', t !== 'seeds');
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', (i === 0 && t === 'drill') || (i === 1 && t === 'seeds'))
  );
  if (t === 'seeds') { renderSeedCard(); renderVocabStrip(); }
}

/* ─────────────────────────────────────────────
   VERB SEEDS RENDER FUNCTIONS
───────────────────────────────────────────── */

/** Cup type → CSS class */
function tagClass(t) { return t === 'S' ? 's' : t === 'Y/N' ? 'yn' : 'q'; }

/** Single cup row for verb seeds */
function renderCupRow(row) {
  return `<div class="cup-row">
    <div class="cup-tag ${tagClass(row[0])}">${row[0]}</div>
    <div>
      <div class="cup-main">${row[1]}</div>
      <div class="cup-note">${row[2]}</div>
    </div>
  </div>`;
}

/** Language block for verb seeds (respects currentLang) */
function renderSeedLangBlock(label, rows, borderRight, langKey) {
  if (currentLang !== 'both' && currentLang !== langKey) return '';
  return `<div class="lang-block${borderRight && currentLang === 'both' ? ' border-right' : ''}">
    <div class="lang-label">${label}</div>
    ${rows.map(r => renderCupRow(r)).join('')}
  </div>`;
}

/** Vocab word tiles */
function renderVocabStrip() {
  const v = verbs[currentVerb];
  let w = '';
  for (let i = 0; i < v.vocab.kr.length; i++) {
    w += `<div class="vocab-word">`;
    if (currentLang !== 'chinese') w += `<span class="vocab-kr">${v.vocab.kr[i]}</span>`;
    if (currentLang !== 'korean')  w += `<span class="vocab-zh">${v.vocab.zh[i]}</span>`;
    w += `</div>`;
  }
  document.getElementById('vocab-header').innerHTML = `
    <div class="vocab-header">
      <div class="vocab-label">Vocab</div>
      <div class="vocab-hint">swap any into the cups below</div>
    </div>`;
  document.getElementById('vocab-strip').innerHTML = w;
}

/** Seed card + grammar notes */
function renderSeedCard() {
  const v = verbs[currentVerb];
  const t = v.tenses[currentTense];
  const label = currentLang === 'both' ? `${v.kr} / ${v.zh}`
              : currentLang === 'korean' ? v.kr : v.zh;

  document.getElementById('seed-card').innerHTML = `
    <div class="set-card">
      <div class="set-header">
        <div class="set-title" style="font-size:12px;letter-spacing:1.5px;text-transform:uppercase;font-style:normal;font-family:monospace;">${label} — ${t.label}</div>
      </div>
      <div class="set-body">
        ${renderSeedLangBlock('한국어 · Korean', t.kr, true, 'korean')}
        ${renderSeedLangBlock('中文 · Chinese', t.zh, false, 'chinese')}
      </div>
    </div>`;

  let n = '';
  if (currentLang !== 'chinese') {
    n += `<div class="struct-note-row"><span class="struct-lang-tag kr">KR</span><span class="struct-note-text">${v.noteKR}</span></div>`;
  }
  if (currentLang !== 'korean') {
    n += `<div class="struct-note-row"><span class="struct-lang-tag zh">ZH</span><span class="struct-note-text">${v.noteZH}</span></div>`;
  }
  document.getElementById('struct-note').innerHTML = n;
}


/* ─────────────────────────────────────────────
   VERB SEEDS EVENT HANDLERS
───────────────────────────────────────────── */
function setVerb(id) {
  currentVerb = id;
  currentTense = 0;
  document.querySelectorAll('.verb-btn').forEach((b, i) =>
    b.classList.toggle('active', verbOrder[i] === id)
  );
  document.querySelectorAll('.tense-btn').forEach((b, i) =>
    b.classList.toggle('active', i === 0)
  );
  renderSeedCard();
  renderVocabStrip();
}

function setTense(i) {
  currentTense = i;
  document.querySelectorAll('.tense-btn').forEach((b, j) =>
    b.classList.toggle('active', j === i)
  );
  renderSeedCard();
}


/* ═══════════════════════════════════════════════════════════════
   INITIALIZATION
   Build dynamic UI elements and render the first week.
═══════════════════════════════════════════════════════════════ */

/* Build week selector strip */
document.getElementById('week-strip').innerHTML = weeks.map((wk, i) => {
  const num = i + 1;
  const reviewClass = wk.isReview ? ' review-week' : '';
  const activeClass = num === 1 ? ' active' : '';
  return `<button class="week-btn${reviewClass}${activeClass}" onclick="setWeek(${num})">
    <span class="wk-num">Week ${num}</span>
    <span class="wk-focus">${wk.title}</span>
    ${wk.isReview ? '<span class="review-badge">REVIEW</span>' : ''}
  </button>`;
}).join('');

/* Build verb seed buttons */
document.getElementById('verb-buttons').innerHTML = verbOrder.map((k, i) => {
  const v = verbs[k];
  return `<button class="verb-btn${i === 0 ? ' active' : ''}" onclick="setVerb('${k}')">
    <span class="vb-chars">${v.kr} · ${v.zh}</span>
    <span class="vb-eng">${k}</span>
  </button>`;
}).join('');

/* Render Week 1 on page load */
setWeek(1);
</script>
